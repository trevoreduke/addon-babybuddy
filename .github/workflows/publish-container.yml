name: "Publish Container"

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/babybuddy

jobs:
  aarch64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Publish Container (aarch64)
        uses: home-assistant/builder@master
        with:
          args: |
            --aarch64 \
            --target babybuddy \
            --docker-hub ghcr.io/trevoreduke

  amd64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
