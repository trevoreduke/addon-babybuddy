---
name: Baby Buddy (Voice Logger Edition)
version: 2.7.1-voice4
homeassistant: 2023.6.2
slug: baby_buddy_voice
description: Track sleep, feedings, diaper changes, tummy time and more! Includes voice logging.
url: https://github.com/trevoreduke/addon-babybuddy
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
panel_icon: hass:baby-bottle
ingress: true
ingress_port: 1337
ingress_stream: false
panel_admin: false
options:
  CSRF_TRUSTED_ORIGINS: ""
  INGRESS_USER: ""
  log_level: info
schema:
  CSRF_TRUSTED_ORIGINS: str
  INGRESS_USER: str
  log_level: list(debug|info|warning|error|critical)
ports:
  8000/tcp: 8009
ports_description:
  8000/tcp: Web interface (Not required for Ingress)
